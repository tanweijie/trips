function b64(bytes){let s='';for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s);}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function derive(pass,salt){const material=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(text,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await derive(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,tagLength:128},key,enc.encode(text));return {v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)};}
async function unseal(v,pass){if(v.v!==1)throw Error('Unsupported format');const salt=unb64(v.salt),iv=unb64(v.iv);if(salt.length!==16||iv.length!==12)throw Error('Invalid envelope');const key=await derive(pass,salt);return new TextDecoder('utf-8',{fatal:true}).decode(await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,unb64(v.ct)));}
